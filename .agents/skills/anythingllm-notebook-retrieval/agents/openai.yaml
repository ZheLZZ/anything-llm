interface:
  display_name: "AnythingLLM Notebook Retrieval"
  short_description: "搜索本地 AnythingLLM 知识库并按需扩展相邻分块"
  default_prompt: "使用 $anythingllm-notebook-retrieval 搜索本地知识库，并仅对相关命中扩展前后分块。"

dependencies:
  tools:
    - type: "mcp"
      value: "anythingllm_local"
      description: "Local AnythingLLM notebook retrieval MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
