name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      # Collector runs from /app and reads dotenv from its working directory.
      - "./.env:/app/.env:ro"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    # Keep UI-managed settings in the mounted .env: env_file would freeze
    # their values at container creation and override later saves on restart.
    environment:
      STORAGE_DIR: /app/server/storage
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
